name: THYAO Bot

on:
  schedule:
    - cron: '*/15 7-14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install yfinance
      - name: Run bot
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "thyao-bot"
          git config user.email "bot@thyao.local"
          git add state.json
          git diff --staged --quiet || git commit -m "Bot: $(date -u +'%Y-%m-%d %H:%M')"
          git push
