name: THYAO Bot

on:
  schedule:
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: pip install yfinance pandas numpy

      - name: Run bot
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "thyao-bot"
          git config user.email "bot@thyao.local"
          git add state_v25.pkl bot_v25.db || true
          git diff --staged --quiet || git commit -m "Bot: $(date -u +'%Y-%m-%d %H:%M')"
          git push
